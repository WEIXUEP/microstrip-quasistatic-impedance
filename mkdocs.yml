site_name: 微带线准静态阻抗计算
site_description: 基于 Gmsh、scikit-fem 和 SciPy 的二维微带线准静态 FEM 使用与理论文档
site_url: https://weixuep.github.io/microstrip-quasistatic-impedance/
repo_url: https://github.com/WEIXUEP/microstrip-quasistatic-impedance
repo_name: WEIXUEP/microstrip-quasistatic-impedance
edit_uri: edit/main/doc/
docs_dir: doc
site_dir: site
strict: true
validation:
  links:
    not_found: warn
    anchors: warn
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
nav:
  - 首页: index.md
  - 使用指南:
      - 安装与快速开始: quickstart.md
      - 几何、材料与边界: geometry.md
      - 命令行参数: cli.md
      - 输出文件与结果: output.md
  - 计算与验证:
      - 准静态 FEM 原理: theory.md
      - 收敛与对照案例: validation.md
  - 维护与支持:
      - 常见问题: troubleshooting.md
      - 开发与文档发布: development.md
