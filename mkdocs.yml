site_name: Microstrip FEM
site_description: A practical engineering guide to quasi-static microstrip impedance with Gmsh, scikit-fem and SciPy.
site_url: https://weixuep.github.io/microstrip-quasistatic-impedance/
repo_url: https://github.com/WEIXUEP/microstrip-quasistatic-impedance
repo_name: View on GitHub
edit_uri: edit/main/doc/
docs_dir: doc
site_dir: site
strict: true
validation:
  links:
    not_found: warn
    anchors: warn
theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
plugins:
  - search:
      lang: en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/engineering.css
nav:
  - Overview: index.md
  - Calculator: calculator/index.md
  - User guide:
      - Installation & first run: quickstart.md
      - Desktop calculator: desktop.md
      - Geometry & boundaries: geometry.md
      - Command-line reference: cli.md
      - Output reference: output.md
  - Method & verification:
      - Quasi-static FEM: theory.md
      - Convergence & benchmarks: validation.md
  - Project:
      - Troubleshooting: troubleshooting.md
      - Development & publishing: development.md
